name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Type-check library
        run: npm run typecheck

      # - name: Lint (Biome)
      #   run: npm run check

      - name: Build Next.js app
        run: npm -w apps/zoutex-playground run build

      - name: Run unit tests
        run: npm test -- --reporter=verbose --reporter=junit --outputFile=test-results.xml --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload unit test results to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./test-results.xml
          flags: unit
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run e2e tests
        run: npm -w apps/zoutex-playground run test -- --reporter=verbose --reporter=junit --outputFile=test-results.xml

      - name: Upload e2e test results to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./apps/zoutex-playground/test-results.xml
          flags: e2e
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish unit test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          check_name: Unit Test Report
          report_paths: test-results.xml

      - name: Publish e2e test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          check_name: E2E Test Report
          report_paths: apps/zoutex-playground/test-results.xml
